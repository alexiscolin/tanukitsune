name: verify

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repository, so nothing here needs to be able to.
# Actions are pinned to commit SHAs: a mutable tag is a third party's decision
# about what runs in this repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      # next build rewrites tsconfig.json when it dislikes it, and strict is what it turns off.
      - name: The build left tsconfig.json alone
        run: git diff --exit-code tsconfig.json

  e2e:
    runs-on: ubuntu-latest
    # Against a server Postgres, not the local file-backed one, so the driver
    # that runs in production is the driver a merge is gated on.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: tanukitsune
          POSTGRES_DB: tanukitsune
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:tanukitsune@127.0.0.1:5432/tanukitsune
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm db:migrate
      - run: pnpm test:e2e

  # The five lenses are spawned by a human and by nothing else, so this job is what
  # refuses a merge they never read. It is the only automatic caller of that script,
  # and the strictest reading of it: a detached head names no branch, so unsorted
  # findings are counted over the whole log rather than over one branch of it.
  review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          # The default is the merge commit, whose history holds the base branch
          # too, and every commit of it would then need a pass of its own.
          ref: ${{ github.event.pull_request.head.sha }}
      # Through the environment, never interpolated into the shell: a ref name is
      # third-party text and `${{ }}` inside `run:` is substituted before bash sees it.
      - name: A review pass has read every commit of code on this branch
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: bash scripts/check-review-coverage.sh "origin/$BASE_REF"
      # Here rather than in a job of its own, so it refuses a merge from the day it is
      # written: a fifth job would need adding to the required set before it gated
      # anything, and a check that blocks nothing reads as a guard that is in place.
      - name: No commit on this branch took an assertion away
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: bash scripts/check-test-strength.sh "origin/$BASE_REF"

  # One convention, one script, two places it is checked. Nothing blocks a commit
  # locally: an agent stopped mid-loop by a message check loses more than the
  # check is worth, so the gate is here.
  subjects:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: The title reads as a conventional subject under 72 characters
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: bash scripts/check-subject.sh "$TITLE"
      - name: Every commit on the branch does too
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          fail=0
          while IFS= read -r subject; do
            bash scripts/check-subject.sh "$subject" || fail=1
          done < <(git log --format=%s "$BASE..$HEAD")
          exit "$fail"
      # The plan lives in the description and nowhere else, which makes an empty
      # description a lost plan rather than a formatting lapse.
      - name: The description carries the plan
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          lines=$(printf '%s\n' "$BODY" | grep -c '[^[:space:]]' || true)
          [ "${lines:-0}" -ge 5 ] && exit 0
          echo "The description holds ${lines:-0} non-empty lines. The plan goes here." >&2
          exit 1
