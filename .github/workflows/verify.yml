name: verify

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repository, so nothing here needs to be able to.
# Actions are pinned to commit SHAs: a mutable tag is a third party's decision
# about what runs in this repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      # next build rewrites tsconfig.json when it dislikes it, and strict is what it turns off.
      - name: The build left tsconfig.json alone
        run: git diff --exit-code tsconfig.json

  e2e:
    runs-on: ubuntu-latest
    # Against a server Postgres, not the local file-backed one, so the driver
    # that runs in production is the driver a merge is gated on.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: tanukitsune
          POSTGRES_DB: tanukitsune
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:tanukitsune@127.0.0.1:5432/tanukitsune
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm db:migrate
      - run: pnpm test:e2e

  # One convention, one script, two places it is checked. Nothing blocks a commit
  # locally: an agent stopped mid-loop by a message check loses more than the
  # check is worth, so the gate is here.
  subjects:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: The title reads as a conventional subject under 72 characters
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: bash scripts/check-subject.sh "$TITLE"
      - name: Every commit on the branch does too
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          fail=0
          while IFS= read -r subject; do
            bash scripts/check-subject.sh "$subject" || fail=1
          done < <(git log --format=%s "$BASE..$HEAD")
          exit "$fail"
      # The plan lives in the description and nowhere else, which makes an empty
      # description a lost plan rather than a formatting lapse.
      - name: The description carries the plan
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          lines=$(printf '%s\n' "$BODY" | grep -c '[^[:space:]]' || true)
          [ "${lines:-0}" -ge 5 ] && exit 0
          echo "The description holds ${lines:-0} non-empty lines. The plan goes here." >&2
          exit 1

  # Two documents describing the same rule differently is invisible to every
  # deterministic gate, and the local hook that catches it depends on a turn
  # having happened. This is the one that depends on nothing.
  conformity:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - id: markdown
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          changed=$(git diff --name-only "$BASE..$HEAD" -- '*.md' | grep -c '' || true)
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
      # Without the secret the job passes rather than fails: a repository fork has
      # no access to it, and a gate that cannot run must not read as one that did.
      - if: steps.markdown.outputs.changed == '0' || env.HAS_KEY != 'true'
        run: echo "No markdown changed, or no key available. Nothing to read."
      - if: steps.markdown.outputs.changed != '0' && env.HAS_KEY == 'true'
        uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: --model claude-sonnet-5 --max-turns 40 --allowedTools Read,Grep,Glob,Write
          prompt: |
            Read .claude/agents/docs-conformity.md and follow it exactly as your instructions.
            Review the whole documentation set against itself, against the code it describes,
            and against the code comments carrying the same constraints.
            Write your findings to conformity-report.md in the repository root.
            Write the single word CLEAN to that file, and nothing else, if you find nothing.
      - if: steps.markdown.outputs.changed != '0' && env.HAS_KEY == 'true'
        run: |
          [ -f conformity-report.md ] || { echo "The reviewer wrote no report." >&2; exit 1; }
          head -n 1 conformity-report.md | tr -d '[:space:]' | grep -qx CLEAN && exit 0
          echo "Documentation contradictions, which no deterministic gate can see:" >&2
          cat conformity-report.md >&2
          exit 1
